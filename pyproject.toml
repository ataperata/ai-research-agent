[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Researches a question on the web and writes a Markdown and HTML report where every factual sentence is cited and checked."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ata Perata" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["research", "citations", "llm", "web-search", "fact-checking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
research = "research_agent.cli:main"

[project.urls]
Repository = "https://github.com/ataperata/ai-research-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
